<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- 项目原创学习示意：依据河南博物院文字记载，概括红衣黑彩、并列双壶与腹部椭圆通口。
       中央暖白区域表示前壁示意性剖开后的内部空间，灰绿椭圆表示相通的开口。
       本图比例、壁厚、纹线数量与通口尺寸均非实测，不是文物照片或考古复原。
       后续调整不得把两腹改成仅用外部把手连接，也不能改为其他器物的白衣彩陶纹样。 -->
  <rect x="0" y="0" width="1000" height="600" rx="28" fill="#FAF6F0"/>
  <ellipse cx="500" cy="507" rx="310" ry="15" fill="#8CA79B" fill-opacity="0.16"/>

  <!-- 双体外形仅表达口、颈、腹、底的关系，轮廓为自主设计。 -->
  <path d="M292 174 C301 202 310 220 300 244 C291 264 255 278 234 307 C205 347 207 397 230 438 C244 463 265 481 286 490 L418 490 C450 467 473 441 487 408 C503 370 498 335 478 306 C458 278 420 263 408 243 C396 223 401 201 410 174 Z" fill="#AC553F" stroke="#493D38" stroke-width="3" stroke-linejoin="round"/>
