<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' resource:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>文明连线</title>
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <div id="graph" role="group" aria-label="文化关联图谱"></div>
  <div class="space-tools" aria-label="图谱视角">
    <span class="space-title">年代空间 <span>前景早期 · 远景晚期</span></span>
    <button id="graph-turn" type="button" aria-label="向右旋转图谱">旋转 ↻</button>
    <button id="graph-reset" type="button" aria-label="重置图谱视角">复位</button>
  </div>
  <div class="space-legend" aria-hidden="true"><span>仰韶 / 龙山</span><i></i><span>夏商 · 周 · 汉唐 · 宋</span></div>
  <script src="three/three.min.js"></script>
  <script src="graph-layout.js"></script>
  <script src="graph-space.js"></script>
  <script src="graph.js"></script>
</body>
</html>
